
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1">
<title>EagleEye Amazon Global - 100 Products</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#06132c;
 color:white;font-family:Arial,sans-serif;
}
header{
 text-align:center;padding:30px 12px;
 background:linear-gradient(135deg,#06132c,#174782);
 border-bottom:3px solid #ffd76a;
}
h1{color:#ffd76a}
nav{text-align:center;padding:15px}
.btn{
 display:inline-block;
 background:#ffd76a;color:#06132c;
 border:0;border-radius:9px;
 padding:12px 18px;margin:5px;
 text-decoration:none;font-weight:bold;
 cursor:pointer;
}
main{max-width:1400px;margin:auto;padding:16px}
#products{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
 gap:16px;
}
.card{
 background:#102b55;
 border:1px solid #d6ad45;
 border-radius:15px;padding:16px;
}
.card h3{color:#ffd76a}
.card input{
 display:block;width:100%;
 padding:10px;margin:9px 0;
 border:1px solid #8195b4;
 border-radius:7px;
}
.card a{
 display:inline-block;
 background:#ffd76a;color:#06132c;
 padding:10px;border-radius:8px;
 text-decoration:none;margin-top:8px;
}
.note{text-align:center;color:#ddd}
</style>
</head>
<body>
<header>
<h1>🦅 EagleEye Global Shopping</h1>
<h2>🌍 Amazon Global - 100 Products</h2>
<p>โรงงานเตรียมสินค้า Amazon Affiliate</p>
</header>

<nav>
<a class="btn" href="../eagleeye_shopping.html">
กลับหน้าช้อปปิ้ง
</a>
<a class="btn" href="../eagleeye.html">
กลับหน้าหลัก EagleEye
</a>
<button class="btn" onclick="exportData()">
สำรองข้อมูล JSON
</button>
</nav>

<main>
<p class="note">
ช่องสินค้า 001–100 | กรอกข้อมูลแล้วกดบันทึก
</p>
<section id="products"></section>
</main>

<script>
const storageKey="eagleeye_amazon_100_v1";
let products=[];

try{
 products=JSON.parse(
  localStorage.getItem(storageKey)||"[]"
 );
 if(!Array.isArray(products))products=[];
}catch(e){products=[];}

const area=document.getElementById("products");

function saveProduct(i){
 const card=document.getElementById("p"+i);
 const inputs=card.querySelectorAll("input");
 const item={
  name:inputs[0].value,
  price:inputs[1].value,
  commission:inputs[2].value,
  image:inputs[3].value,
  link:inputs[4].value
 };
 products[i]=item;
 try{
  localStorage.setItem(
   storageKey,JSON.stringify(products)
  );
  alert("บันทึกสินค้า "+(i+1)+" แล้ว");
 }catch(e){
  alert("บันทึกไม่สำเร็จ");
 }
}

function exportData(){
 const blob=new Blob(
  [JSON.stringify(products,null,2)],
  {type:"application/json"}
 );
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="amazon_100_backup.json";
 a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

for(let i=0;i<100;i++){
 const p=products[i]||{};
 const card=document.createElement("article");
 card.className="card";
 card.id="p"+i;

 const heading=document.createElement("h3");
 heading.textContent=
  "สินค้า "+String(i+1).padStart(3,"0");
 card.appendChild(heading);

 const fields=[
  ["name","ชื่อสินค้า"],
  ["price","ราคา / สกุลเงิน"],
  ["commission","ค่าคอมมิชชัน (%)"],
  ["image","ลิงก์รูปภาพ"],
  ["link","ลิงก์ Amazon Affiliate"]
 ];

 fields.forEach(([key,label])=>{
  const input=document.createElement("input");
  input.placeholder=label;
  input.setAttribute("aria-label",label);
  input.value=p[key]||"";
  card.appendChild(input);
 });

 const button=document.createElement("button");
 button.className="btn";
 button.textContent="บันทึกสินค้า";
 button.onclick=()=>saveProduct(i);
 card.appendChild(button);

 const link=document.createElement("a");
 link.textContent="ดูสินค้า";
 link.target="_blank";
 link.rel="noopener noreferrer";
 const savedLink=p.link||"";
 if(/^https?:\/\//i.test(savedLink)){
  link.href=savedLink;
 }else{
  link.style.display="none";
 }
 card.appendChild(link);

 area.appendChild(card);
}
</script>
 <div style="text-align:center;padding:24px;">
  <a href="../eagleeye_shopping.html"
     style="display:inline-block;background:#d4af37;color:#06132c;padding:14px 22px;border-radius:12px;font-weight:bold;text-decoration:none;">
    ← กลับหน้าช้อปปิ้ง
  </a>
</div>
</body>
</html>
